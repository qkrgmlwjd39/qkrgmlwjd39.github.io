<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heejung Park — Academic Portfolio</title><meta name="description" content="Heejung Park, Ph.D. Candidate at DGIST — medical image analysis and federated learning.">
<link rel="icon" href="images/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#18263c;--sub:#59677b;--accent:#3673bf;--line:#e3e9f0;--soft:#f1f6fd}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:85px}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--c);line-height:1.7;background:white}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:1030px;margin:auto;padding:0 28px}.nav{position:sticky;top:0;z-index:5;background:#ffffffeb;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav .shell{display:flex;min-height:65px;align-items:center;justify-content:space-between;gap:20px}.brand{font:700 20px Lora,serif;color:var(--c)}.links{display:flex;gap:16px;flex-wrap:wrap}.links a{color:var(--sub);font-size:12px;font-weight:600}.hero{display:grid;grid-template-columns:185px 1fr;align-items:center;gap:40px;padding:62px 0 45px;border-bottom:1px solid var(--line)}.photo{width:185px;height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);box-shadow:0 8px 24px #10284612}h1{font:700 43px Lora,serif;letter-spacing:-1px;margin:0 0 7px}h2{font:700 27px Lora,serif;margin:0 0 22px}.subtitle{font-size:17px;font-weight:600;margin:0}.minor{color:var(--sub);margin:3px 0 15px}.pill{display:inline-block;padding:4px 11px;border:1px solid var(--line);border-radius:8px;margin:0 8px 7px 0;font-size:12px;font-weight:600}section{border-bottom:1px solid var(--line);padding:39px 0}p{margin:0 0 13px}.about p{margin-bottom:14px}.about mark{background:var(--soft);color:#2b5c9c;padding:0 3px}.timeline{margin-left:6px;padding-left:28px;border-left:2px solid var(--line)}.item{position:relative;margin-bottom:26px}.item:last-child{margin-bottom:0}.item:before{content:"";width:10px;height:10px;background:var(--accent);border:3px solid white;outline:1px solid var(--accent);border-radius:100%;position:absolute;top:7px;left:-36px}.date{font-size:12px;font-weight:700;color:var(--accent)}h3{font-size:16px;line-height:1.45;margin:4px 0}.detail{color:var(--sub);font-size:14px;white-space:normal}.pub{display:grid;grid-template-columns:42px 1fr;gap:10px;border-top:1px solid var(--line);padding:20px 0}.pub-index{font-size:12px;font-weight:700;color:#8e99aa}.badge{font-size:11px;font-weight:700;color:#2a65a7;background:#eef5ff;border-radius:5px;padding:3px 8px}.pub h3{margin:8px 0 5px}.authors,.pubmeta{font-size:13px;color:var(--sub)}.pub a.ext{display:inline-block;font-size:12px;padding:2px 10px;margin-top:9px;border:1px solid var(--line);border-radius:6px}.filters{display:flex;gap:7px;margin-bottom:21px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:white;color:var(--sub);border-radius:7px;padding:8px 13px;cursor:pointer;font:600 12px Inter,Arial,sans-serif}.filters button.active{background:var(--accent);border-color:var(--accent);color:white}.simple{padding:0;list-style:none;margin:0}.simple li{border-top:1px solid var(--line);padding:16px 0;font-size:14px}.simple strong{font-weight:700}footer{text-align:center;color:#929baa;font-size:12px;padding:26px}.empty{display:none}@media(max-width:760px){.nav .shell{align-items:flex-start;flex-direction:column;gap:5px;padding-top:12px;padding-bottom:12px}.links{gap:8px 12px}.shell{padding-left:20px;padding-right:20px}.hero{grid-template-columns:1fr;padding-top:35px;gap:20px}.photo{width:155px;height:185px}h1{font-size:34px}section{padding:29px 0}}@media print{.nav,.filters{display:none}}
</style></head><body>
<header class="nav"><div class="shell"><a class="brand" href="#top">Heejung Park</a><nav class="links" id="nav"></nav></div></header>
<main class="shell" id="top"><div class="hero"><img class="photo" alt="Heejung Park profile" src="images/hj_profile.jpg"><div><h1>Heejung Park</h1><p class="subtitle">Ph.D. Candidate at DGIST, South Korea</p><p class="minor">Medical Image and Signal Processing Laboratory · DGIST</p><div><a class="pill" href="mailto:heejungpark@dgist.ac.kr">Email</a><a class="pill" href="https://github.com/qkrgmlwjd39" target="_blank" rel="noopener">GitHub</a></div></div></div>
<div id="sections"></div></main><footer>Heejung Park · DGIST</footer>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
const addedPaper={title:'Retrieval-Guided Multi-Task Semi-Supervised Federated Segmentation',venue:'Medical Image Analysis',status:'Under review'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sectionId(t){return String(t).toLowerCase().replace(/[^a-z]+/g,'-').replace(/^-|-$/g,'')}
function detailRow(item){let date=item.sub_title||'',content=item.quote||'';return '<article class="item"><span class="date">'+esc(date)+'</span><div class="detail">'+content+'</div></article>'}
function publications(items){let known=items.map((p,i)=>{let venue=p.quote||'';let journal=/transactions on medical imaging|medical image analysis/i.test(venue);return {title:p.sub_title,authors:p.caption||'',meta:venue,kind:journal?'journal':'conference'}});
known.unshift({title:addedPaper.title,authors:'',meta:'<b>'+esc(addedPaper.venue)+'</b> — '+esc(addedPaper.status),kind:'journal'});
let buttons='<div class="filters" role="group" aria-label="Publication filters"><button class="active" data-filter="all">All ('+known.length+')</button><button data-filter="journal">Journal ('+known.filter(p=>p.kind==='journal').length+')</button><button data-filter="conference">Conference ('+known.filter(p=>p.kind==='conference').length+')</button></div>';
return buttons+known.map((p,i)=>'<article class="pub" data-kind="'+p.kind+'"><span class="pub-index">'+(p.kind==='journal'?'J':'C')+'</span><div><span class="badge">'+(p.kind==='journal'?'Journal':'Conference')+'</span><h3>'+esc(p.title)+'</h3>'+(p.authors?'<p class="authors">'+esc(p.authors)+'</p>':'')+'<p class="pubmeta">'+p.meta+'</p></div></article>').join('')}
function render(c){document.querySelector('.photo').src=c.about_profile_image||'images/hj_profile.jpg';document.querySelector('.subtitle').textContent=c.title||'Ph.D. Candidate at DGIST, South Korea';let sections='<section id="about" class="about"><h2>About</h2>'+String(c.about_content||'').split(/\n\s*\n/).map(p=>'<p>'+p.trim()+'</p>').join('')+'</section>';
(c.content||[]).forEach(sec=>{let title=sec.title||'',id=sectionId(title),body='';if(title==='Publications')body=publications(sec.content||[]);else if(sec.layout==='text')body='<p>'+String(sec.content||'').replace(/\n/g,' ')+'</p>';else body='<div class="timeline">'+(sec.content||[]).map(detailRow).join('')+'</div>';sections+='<section id="'+id+'"><h2>'+esc(title)+'</h2>'+body+'</section>'});document.querySelector('#sections').innerHTML=sections;let titles=['About',...(c.content||[]).map(x=>x.title)];document.querySelector('#nav').innerHTML=titles.map(t=>'<a href="#'+sectionId(t)+'">'+esc(t==='Research Experience'?'Experience':t==='Research Projects'?'Projects':t)+'</a>').join('');document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{let f=b.dataset.filter;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pub').forEach(p=>p.hidden=f!=='all'&&p.dataset.kind!==f)});}
fetch('_config.yml').then(r=>{if(!r.ok)throw Error('Config missing');return r.text()}).then(t=>render(jsyaml.load(t))).catch(e=>{document.querySelector('#sections').innerHTML='<section><h2>Page temporarily unavailable</h2><p>Unable to load profile data.</p></section>';console.error(e)});
</script></body></html>
